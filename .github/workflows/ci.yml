name: Rust Cloudflare validation
on:
  push:
    branches: [main, feature/production-hardening]
  pull_request:
  workflow_dispatch:
concurrency:
  group: api-chat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Rustfmt source capture (one-time modernization)
        run: |
          cargo fmt --all
          for file in src/*.rs; do
            key=$(echo "$file" | tr '/' '_' | tr '.' '_')
            echo "FORMAT_B64_${key}:$(base64 -w0 "$file")"
          done
          cargo fmt --all --check
      - name: Check Rust WASM
        run: cargo check --target wasm32-unknown-unknown --locked
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Native unit tests
        run: cargo test --lib --locked
      - name: Cache worker-build binary
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ runner.arch }}
      - name: Install worker-build
        run: |
          if ! command -v worker-build >/dev/null; then
            cargo install worker-build --version 0.8.7 --locked
          fi
      - name: Save compiled worker-build
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install JS test tooling and Wrangler
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare Worker
        run: npm run build
      - name: Synthetic secrets for local tests
        run: |
          node --input-type=module -e '
            import {randomBytes} from "node:crypto";
            import {writeFileSync} from "node:fs";
            const parts=["AUTH_KEY_V1","AUTH_KEY_V2","MESSAGE_KEY_V1","MESSAGE_KEY_V2","DEDUP_KEY"];
            writeFileSync(".dev.vars", [
              "ADMIN_KEY=chat-ci-development-admin-secret-not-for-production",
              ...parts.map(key=>key+"="+randomBytes(32).toString("base64url"))
            ].join("\n")+"\n",{mode:0o600});
          '
      - name: Apply isolated D1 migrations
        run: npx wrangler d1 migrations apply DB --local
      - name: Integration tests (HTTP, Durable Objects, WebSockets, crypto, auth)
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/api-chat-wrangler.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/api-chat-wrangler.log' EXIT
          ready=0
          for n in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Worker did not become healthy"
            exit 1
          fi
          npm run test:integration
