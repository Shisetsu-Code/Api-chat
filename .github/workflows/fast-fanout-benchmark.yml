name: Fast fanout throughput experiment (250 x 4)

on:
  push:
    branches: [perf/fast-fanout-after-commit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Cloudflare Rust build tool
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-Linux-X64
      - name: Install worker-build if missing
        run: |
          if ! command -v worker-build >/dev/null; then
            cargo install worker-build --version 0.8.7 --locked
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore exact locked JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate benchmark and compile Worker
        run: |
          node --check scripts/benchmark-250.mjs
          npm run build
      - name: Prepare synthetic isolated test keys
        run: |
          node --input-type=module -e '
            import {randomBytes} from "node:crypto";
            import {writeFileSync} from "node:fs";
            const keys=["AUTH_KEY_V1","AUTH_KEY_V2","MESSAGE_KEY_V1","MESSAGE_KEY_V2","DEDUP_KEY"];
            writeFileSync(".dev.vars",[
              "ADMIN_KEY=chat-ci-development-admin-secret-not-for-production",
              ...keys.map(key=>key+"="+randomBytes(32).toString("base64url"))
            ].join("\n")+"\n",{mode:0o600});
          '
      - name: Migrate isolated local D1
        run: npx wrangler d1 migrations apply DB --local
      - name: Run fastpath benchmark (target rate is an assertion)
        env:
          BENCH_CLIENTS: "250"
          BENCH_RATE: "4"
          BENCH_SECONDS: "15"
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/benchmark-worker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; tail -n 60 /tmp/benchmark-worker.log' EXIT
          healthy=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Local Cloudflare Worker failed to become healthy"
            exit 1
          fi
          node scripts/benchmark-250.mjs
      - name: Save raw benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastpath-250-clients-4mps
          path: artifacts/bench-250-clients.json
          if-no-files-found: warn
