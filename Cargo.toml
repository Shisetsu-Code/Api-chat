[package]
name = "api-chat"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
uuid = { version = "=1.29.2", features = ["serde"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
hkdf = "=0.13.0"
subtle = "=2.6.1"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"
